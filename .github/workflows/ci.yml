name: CI

on:
  push:
  pull_request:

jobs:
  e2e-test:
    # Pinned: ubuntu-latest moves to 26.04 on 2026-10-19
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: config/environment.yaml
          cache-environment: true

      - name: Validate sample sheet schema, router, QC gates, filter tags
        shell: bash -el {0}
        run: |
          python tests/test_sample_sheet.py
          python tests/test_qc_gates.py
          python tests/test_pileup_report.py
          python tests/test_filter_tags.py

      - name: Index test reference
        shell: bash -el {0}
        run: |
          bwa index test/ref/tiny.fa
          samtools faidx test/ref/tiny.fa
          gatk CreateSequenceDictionary -R test/ref/tiny.fa

      - name: Run pipeline end-to-end (CPU mode, paired-end)
        shell: bash -el {0}
        run: |
          cp config/config.ci.yaml config/config.local.yaml
          snakemake --cores 2

      - name: Verify planted variant was called
        shell: bash -el {0}
        run: |
          bcftools view -H variants/cohort.raw.vcf.gz | grep -q "C	G" \
            && echo "Planted SNP found" \
            || { echo "Planted SNP missing"; exit 1; }

      - name: Verify targeted-sites report (read-level, AF between 0.25-0.75)
        shell: bash -el {0}
        run: |
          awk -F'\t' 'NR>1 && $2=="planted_snp" && $15=="OK" && $12>=0.25 && $12<=0.75 {found=1}
                      END {exit !found}' variants/targets_report.tsv \
            && echo "Targeted-sites report OK: $(grep planted_snp variants/targets_report.tsv)" \
            || { echo "Targeted-sites report failed:"; cat variants/targets_report.tsv; exit 1; }

      - name: Upload MultiQC report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: multiqc-report
          path: qc/multiqc_report.html
          if-no-files-found: ignore
