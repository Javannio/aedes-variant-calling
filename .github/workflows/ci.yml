name: CI

on:
  push:
  pull_request:

jobs:
  e2e-test:
    # Pinned: ubuntu-latest moves to 26.04 on 2026-10-19
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: config/environment.yaml
          cache-environment: true

      - name: Index test reference
        shell: bash -el {0}
        run: |
          bwa index test/ref/tiny.fa
          samtools faidx test/ref/tiny.fa
          gatk CreateSequenceDictionary -R test/ref/tiny.fa

      - name: Run pipeline end-to-end (CPU mode, paired-end)
        shell: bash -el {0}
        run: |
          cp config/config.ci.yaml config/config.local.yaml
          snakemake --cores 2

      - name: Verify planted variant was called
        shell: bash -el {0}
        run: |
          bcftools view -H variants/cohort.raw.vcf.gz | grep -q "C	G" \
            && echo "Planted SNP found" \
            || { echo "Planted SNP missing"; exit 1; }

      - name: Upload MultiQC report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: multiqc-report
          path: qc/multiqc_report.html
          if-no-files-found: ignore
