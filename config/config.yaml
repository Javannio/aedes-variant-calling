# Aedes aegypti Dengue Variant Calling Pipeline Configuration
# This is a portable configuration - modify paths for your system

# Reference genome settings
reference:
  # Path to Aedes aegypti reference genome FASTA (e.g., AaegL5.0)
  fasta: "ref/AaegL5.0.fasta"
  # BWA index prefix: the exact path as passed to `bwa index`
  # (bwa writes <prefix>.amb/.ann/.bwt/.pac/.sa). Usually the FASTA path
  # itself, e.g. `bwa index ref/AaegL5.0.fasta` -> prefix "ref/AaegL5.0.fasta".
  index_prefix: "ref/AaegL5.0.fasta"
  # Optional: known variants VCF for BQSR (if available)
  known_variants: ""
  # Optional: BED of regions to EXCLUDE from variant filtering
  # (e.g. RepeatMasker annotations, low-mappability regions — AaegL5 is
  # highly repetitive, so excluding repeats removes many false positives)
  exclude_bed: ""

# Sample input configuration
samples:
  # Sample sheet file (TSV/CSV with columns: sample, fastq_r1, fastq_r2)
  sheet: "config/samples.tsv"
  # Alternative: directory containing FASTQ files (paired-end: *_R1_*.fastq.gz, *_R2_*.fastq.gz)
  fastq_dir: ""

# Output directories
output:
  base_dir: "results"
  trimmed_dir: "trimmed"
  aligned_dir: "aligned"
  variant_dir: "variants"
  qc_dir: "qc"
  logs_dir: "logs"

# Tool parameters
tools:
  # Threads per rule (can be overridden per-rule in Snakefile)
  threads: 8
  # Memory limit in GB for Java tools (GATK, etc.)
  java_mem: "16g"
  
  fastp:
    qualified_quality_phred: 20
    length_required: 50
    detect_adapter_for_pe: true
    trim_front1: 0
    trim_front2: 0
    trim_tail1: 0
    trim_tail2: 0
  
  bwa:
    algorithm: "mem"
    min_seed_len: 19
    bandwidth: 100
    # Passed to bwa mem as -c: skip seeds with more than N occurrences
    # (bwa's own default is 500). This is NOT bwa's -K option (batch size in
    # bases, only used for cross-thread reproducibility) — we don't set -K.
    max_occurrences: 500
  
  samtools:
    sort_memory: "500M"
    markdup_rmdup: false
  
  gatk:
    # HaplotypeCaller settings
    emit_ref_confidence: "GVCF"
    min_base_quality_score: 20
    standard_min_confidence_threshold_for_calling: 30.0
    # HaplotypeCaller scatter (CPU mode): balanced whole-contig interval
    # chunks run in parallel and are gathered back into one gVCF per sample.
    # 1 disables scattering (whole-genome run).
    hc_scatter: 8
    # GenomicsDBImport: merge the whole-contig -L intervals into ~N GenomicsDB
    # arrays. AaegL5 has ~1,900 scaffolds; without merging, import is slow.
    # 0 disables merging.
    genomicsdb_num_partitions: 4
  
  bcftools:
    # Site-level hard filters, applied separately to SNPs and indels.
    # The active set is selected by variant caller:
    #   Parabricks mode "deepvariant"      -> tools.bcftools.deepvariant
    #   Parabricks mode "haplotypecaller"  -> tools.bcftools.gatk
    #   CPU mode (GATK)                    -> tools.bcftools.gatk
    # deepvariant: GLnexus output carries only QUAL + FORMAT fields
    # (GT/DP/AD/GQ/PL) — GATK-only tags (QD/MQ/FS/SOR/ReadPosRankSum) are
    # missing and evaluate false in bcftools expressions, silently doing
    # nothing, so GPU-mode filters must use only QUAL/DP/GQ/VAF.
    deepvariant:
      snp_filter: "QUAL<30"
      indel_filter: "QUAL<30"
      # Genotype-level mask (failing genotypes set to ./. ; sites kept):
      # low depth, low genotype quality, or alt allele balance (VAF) < 0.2
      genotype_filter: "FMT/DP<10 || FMT/GQ<20 || (FMT/AD[0:1]/(FMT/AD[0:0]+FMT/AD[0:1]))<0.2"
    # gatk: GATK annotations are present in CPU/GenotypeGVCFs output,
    # so the classic GATK hard-filter expressions work here.
    gatk:
      snp_filter: "QUAL<30 || MQ<40 || QD<2.0 || FS>60.0 || SOR>3.0 || ReadPosRankSum<-8.0"
      indel_filter: "QUAL<30 || QD<2.0 || FS>200.0 || ReadPosRankSum<-20.0"
      genotype_filter: "FMT/DP<10 || FMT/GQ<20"
    # View settings
    output_type: "z"

# Pipeline execution
execution:
  # Use conda environments (requires --use-conda)
  use_conda: true
  # Conda environment file
  conda_env: "config/environment.yaml"
  # Dry run first
  dry_run: false
  # Keep intermediate files (set false to save space)
  keep_intermediates: false
  # Restart from specific rule
  restart_from: ""

# Quality control thresholds
qc:
  min_mapping_rate: 0.80
  min_coverage_depth: 10
  min_genome_fraction_covered: 0.80
  max_duplicate_rate: 0.50

# Reporting
reporting:
  multiqc: true
  summary_table: true
  vcf_stats: true