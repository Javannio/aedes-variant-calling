# CI config: copied to config/config.local.yaml by .github/workflows/ci.yml.
# Merged over config/config.yaml (deep merge), so only overrides live here.
# The CI sheet (config/ci_samples.tsv) holds two individual_wgs samples plus
# one pool_seq fixture (test_pool) that exercises the pool branch.
reference:
  fasta: "test/ref/tiny.fa"
  index_prefix: "test/ref/tiny.fa"
  known_variants: ""
  exclude_bed: ""

samples:
  sheet: "config/ci_samples.tsv"

tools:
  threads: 2
  java_mem: "2g"
  parabricks:
    enabled: false

# The planted heterozygous SNP in test/ref/tiny.fa — exercises the
# targeted-sites report end-to-end in CI (default kdr targets do not
# exist on the tiny reference).
reporting:
  targets:
    - {name: planted_snp, chrom: tiny_contig, pos: 151, ref: C, alt: G}
